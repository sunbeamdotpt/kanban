schema: 1
project:
  name: kanban
  kind: deno-app
  description: "Kanban board service (Deno + Hono + Vite UI + gRPC)."
targets:
  build:
    exec: "deno task build"
  test:
    exec: "deno task test"
  dev:
    exec: "deno task dev"
  clean:
    exec: "rm -rf ui/dist kanban"
deps:
  projects: [beam-ui]
  services: [postgres]
tenant:
  host: kanban.sunbeam.pt
outputs:
  - kanban
