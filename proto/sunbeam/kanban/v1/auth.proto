// SPDX-License-Identifier: AGPL-3.0-or-later
// proto/sunbeam/kanban/v1/auth.proto
//
// AuthService is the SSO integration surface for the Kanban FE.
//
// WhoAmI is the single source of truth for the FE's authStore subject +
// display fields; do not derive these from the JWT alone — the JWT carries
// only opaque claims and the server may have fresher display-name/role data
// from Hydra introspection.
//
// SignalLogout writes the Valkey watermark `auth.logout.{subject}` = now_ms
// with TTL = max_token_lifetime_seconds + 60. Every subsequent JWT recheck
// (per-yield on streams, per-call on unary) reads this key. If the token's
// iat_ms < watermark_ms, the request/stream is closed with Unauthenticated.
// This is the MF-4 resolution: "tokens are stateless except for the logout
// watermark."
//
// Auth: WhoAmI requires only a valid bearer token (no Keto object check);
// SignalLogout also requires only a valid bearer token. Both are
// SubjectScoped entries in the keto_dispatch matrix.

syntax = "proto3";

package sunbeam.kanban.v1;

import "google/protobuf/empty.proto";

option java_package = "pt.sunbeam.kanban.v1";
option java_multiple_files = true;
option go_package = "pt.sunbeam/kanban/v1;kanbanv1";

// ----------------------------------------------------------------------------
// Messages
// ----------------------------------------------------------------------------

// WhoAmIResponse carries the FE's authoritative session identity.
// The FE writes this into authStore on every page load and after token refresh.
message WhoAmIResponse {
  // SSO subject string from the Hydra JWT, e.g. "user:abc123".
  string subject = 1;
  string display_name = 2;
  string email = 3;
  // Resolved Keto relations the subject holds on any KanbanProject, collapsed
  // to a summary list for the FE's role-gating logic, e.g. ["owner", "edit"].
  repeated string roles = 4;
  // Unix milliseconds at which the current access token expires.
  int64 expires_at_ms = 5;
}

// SignalLogoutResponse carries the subject and the written watermark timestamp
// so the FE can confirm the server received the signal before clearing local
// state.
message SignalLogoutResponse {
  string subject = 1;
  // Unix milliseconds written as the Valkey watermark.
  int64 watermark_ms = 2;
}

// ----------------------------------------------------------------------------
// Service
// ----------------------------------------------------------------------------

// AuthService provides session identity introspection and logout signalling.
//
// Auth: both RPCs require a valid bearer token. Neither requires a Keto object
// check (SubjectScoped entries in keto_dispatch matrix). WhoAmI is safe to
// call before any project context is established.
service AuthService {
  // WhoAmI returns the caller's resolved identity and token expiry.
  // The FE uses this as the single source of truth for authStore.subject,
  // authStore.displayName, authStore.email, and role summaries.
  // Never derive these fields from raw JWT claims alone.
  rpc WhoAmI(google.protobuf.Empty) returns (WhoAmIResponse);

  // SignalLogout writes the Valkey logout watermark for the caller's subject.
  // The FE must call this before revoking the refresh token and clearing
  // authStore so in-flight server-streaming connections are closed within
  // the recheck cadence (≤30s per MF-2).
  rpc SignalLogout(google.protobuf.Empty) returns (SignalLogoutResponse);
}
