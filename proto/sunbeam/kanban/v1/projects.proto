// SPDX-License-Identifier: AGPL-3.0-or-later
// proto/sunbeam/kanban/v1/projects.proto
//
// Auth: every RPC in ProjectService requires a valid bearer token. Permission checks
// are performed by the kanban-local
// `permission_dispatch` middleware defined in
// `apps/kanban/src/auth/permission_dispatch.rs`. The per-RPC permission object is sourced
// from the `x-sunbeam-object-id` request header for body-bearing RPCs and from
// the `project_id` path/query param for streaming RPCs; see the dispatch matrix
// in `permission_dispatch.rs` for the authoritative mapping.

syntax = "proto3";

package sunbeam.kanban.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "sunbeam/kanban/v1/events.proto";

option java_package = "pt.sunbeam.kanban.v1";
option java_multiple_files = true;
option go_package = "pt.sunbeam/kanban/v1;kanbanv1";

// ----------------------------------------------------------------------------
// Messages
// ----------------------------------------------------------------------------

// Project is a top-level workspace for boards, cards, and members.
message Project {
  // Immutable ULID assigned at creation.
  string id = 1;
  string name = 2;
  // Short uppercase prefix used for card refs, e.g. "BEAM", "SOL".
  string prefix = 3;
  // Icon identifier from the Sunbeam icon set.
  string icon = 4;
  // CSS color token or hex string for the project accent.
  string color = 5;
  string description = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Denormalized count — exact value via ListMembers.
  int32 member_count = 9;
}

// ProjectMember pairs an SSO subject with a relation on the project.
message ProjectMember {
  string project_id = 1;
  // Hydra/Kratos subject string (e.g. "user:abc123").
  string subject = 2;
  // Permission role: "owner" | "admin" | "editor" | "viewer".
  string relation = 3;
  string display_name = 4;
  string email = 5;
  google.protobuf.Timestamp added_at = 6;
}

// ----------------------------------------------------------------------------
// Request / response messages
// ----------------------------------------------------------------------------

message CreateProjectRequest {
  string name = 1;
  string prefix = 2;
  string icon = 3;
  string color = 4;
  string description = 5;
  // ULID for idempotency.
  string idempotency_key = 6;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectRequest {
  string project_id = 1;
}

message GetProjectResponse {
  Project project = 1;
}

// ListProjectsRequest has no fields: the server derives the subject from the
// JWT and calls permission_expand_objects(KanbanProject, view, subject) to return
// only projects the caller can see. One permission-backend round-trip, not N.
message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message UpdateProjectRequest {
  string project_id = 1;
  // Partial update; only fields named in update_mask are applied.
  Project project = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string project_id = 1;
}

message DeleteProjectResponse {}

message ListMembersRequest {
  string project_id = 1;
}

message ListMembersResponse {
  repeated ProjectMember members = 1;
}

// AddMemberRequest — caller must hold "manage" on the project (enforced by
// the auth dispatch middleware). Writes a permission tuple
// KanbanProject:{project_id}#{relation}@{subject}.
message AddMemberRequest {
  string project_id = 1;
  string subject = 2;
  // Role to grant: "admin" | "editor" | "viewer".
  string relation = 3;
}

message AddMemberResponse {}

message RemoveMemberRequest {
  string project_id = 1;
  string subject = 2;
}

message RemoveMemberResponse {}

// SubscribeProjectRequest — streams project-level events (membership changes,
// board list changes). since_seq is a JetStream sequence number resume token;
// omit for live-tail only.
message SubscribeProjectRequest {
  string project_id = 1;
  // Optional JetStream sequence number to resume from.
  uint64 since_seq = 2;
}

message SubscribeProjectResponse {
  BoardEventEnvelope envelope = 1;
}

// ----------------------------------------------------------------------------
// Service
// ----------------------------------------------------------------------------

// ProjectService manages Kanban projects and their membership.
//
// Auth: every RPC requires a valid bearer token. Permission checks are
// performed by `permission_dispatch` middleware. The object-id source for each
// RPC is documented in the dispatch matrix at
// `apps/kanban/src/auth/permission_dispatch.rs`.
service ProjectService {
  // ListProjects returns only projects the caller can view, using
  // permission_expand_objects(KanbanProject, view, subject) — one permission-backend round-trip.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);

  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);

  // CreateProject requires no prior permission object (the caller becomes owner).
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);

  // UpdateProject requires "edit" on the project.
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);

  // DeleteProject requires "manage" on the project.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  // AddMember requires "manage" on the project. Writes the permission tuple
  // atomically with the project_members mirror row.
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);

  // RemoveMember requires "manage" on the project. Removes the permission tuple.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  // SubscribeProject streams project-level events. Cadence: JWT checked
  // per-yield; permissions rechecked every 30s or on Heartbeat (whichever sooner).
  rpc SubscribeProject(SubscribeProjectRequest) returns (stream SubscribeProjectResponse);
}
