// proto/sunbeam/kanban/v1/search.proto
//
// SearchService provides full-text card search backed by OpenSearch.
// The index is populated by the kanban service on every card mutation
// (title, description, labels, assignees, github_links — matching the
// field set in apps/kanban-old/server/opensearch.ts).
//
// Results are post-filtered through keto_expand_objects per Open Question 8:
// only cards in boards the caller can "view" are returned, regardless of what
// OpenSearch returns. This prevents information leakage from the index.
//
// Auth: SearchCards requires a valid bearer token. Keto filtering is
// performed inside the handler (not in keto_dispatch middleware) because
// the object set is unknown until after the OpenSearch query. The entry
// in the dispatch matrix is SubjectScoped; the handler applies
// keto_expand_objects(KanbanBoard, view, subject) to whittle results.

syntax = "proto3";

package sunbeam.kanban.v1;

option java_package = "pt.sunbeam.kanban.v1";
option java_multiple_files = true;
option go_package = "pt.sunbeam/kanban/v1;kanbanv1";

// ----------------------------------------------------------------------------
// Messages
// ----------------------------------------------------------------------------

// CardSearchHit is a single result from a card search.
message CardSearchHit {
  string card_id = 1;
  string card_ref = 2;
  string board_id = 3;
  string project_id = 4;
  string title = 5;
  // Highlighted snippet from description (HTML-safe, contains <em> tags).
  string description_snippet = 6;
  string priority = 7;
  // "open" | "completed"
  string status = 8;
  repeated string label_names = 9;
  repeated string assignee_subjects = 10;
  // Relevance score from OpenSearch.
  float score = 11;
}

// ----------------------------------------------------------------------------
// Request / response messages
// ----------------------------------------------------------------------------

// SearchCardsRequest specifies the search query and optional facet filters.
// All filter fields are ANDed together. Empty repeated fields mean "no filter".
//
// Results are post-filtered through keto_expand_objects(KanbanBoard, view,
// subject) so the caller only sees cards in boards they can access.
message SearchCardsRequest {
  // Full-text query string. Supports Lucene simple syntax.
  string query = 1;
  // Restrict to specific project IDs; empty means all accessible projects.
  repeated string project_ids = 2;
  // Restrict to specific board IDs; empty means all accessible boards.
  repeated string board_ids = 3;
  // Filter by label names (exact match).
  repeated string label_names = 4;
  // Filter by assignee SSO subjects.
  repeated string assignee_subjects = 5;
  // Max results per page; default 20, max 100.
  int32 limit = 6;
  // Opaque pagination cursor from a previous response; empty for first page.
  string cursor = 7;
}

message SearchCardsResponse {
  repeated CardSearchHit hits = 1;
  // Opaque cursor for the next page; empty string means no more results.
  string next_cursor = 2;
  // Total hit count (approximate for large result sets).
  int64 total = 3;
}

// ----------------------------------------------------------------------------
// Service
// ----------------------------------------------------------------------------

// SearchService provides full-text and faceted search over Kanban cards.
//
// Index fields: title, description, labels, assignees, github_links
// (matching apps/kanban-old/server/opensearch.ts field set).
//
// Auth: SearchCards requires a valid bearer token. Post-filtering via
// keto_expand_objects ensures results are limited to boards the caller
// can view (Open Question 8 resolution). The keto_dispatch entry is
// SubjectScoped; filtering is handler-internal.
service SearchService {
  // SearchCards runs a full-text query against the OpenSearch index and
  // returns matching cards the caller is authorized to see.
  rpc SearchCards(SearchCardsRequest) returns (SearchCardsResponse);
}
