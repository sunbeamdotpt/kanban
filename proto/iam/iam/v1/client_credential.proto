syntax = "proto3";

package iam.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "iam/v1/common.proto";

option go_package = "github.com/sunbeamdotpt/sso-gateway/proto/iam/v1;iamv1";

// ClientCredential is a machine-to-machine OAuth2 client restricted to the
// client_credentials grant. These clients are typically used by services and
// automation that authenticate without an end-user.
message ClientCredential {
  // Gateway identifier for the credential.
  string id = 1;
  // Tenant that owns the credential.
  string tenant_id = 2;
  // Human-readable name of the credential.
  string name = 3;
  // OAuth2 scopes the client may request.
  repeated string scope = 4;
  // Client authentication method used at the token endpoint.
  string token_endpoint_auth_method = 5;
  // Timestamp when the credential was created.
  google.protobuf.Timestamp created_at = 6;
  // Timestamp when the credential was last updated.
  google.protobuf.Timestamp updated_at = 7;
  // Current OAuth2 client secret; only exposed immediately after creation or rotation.
  string client_secret = 8;
}

// ClientCredentialSecret contains the credentials returned after secret rotation.
message ClientCredentialSecret {
  // OAuth2 client identifier.
  string client_id = 1;
  // Newly generated OAuth2 client secret.
  string client_secret = 2;
}

// CreateClientCredentialRequest is the input for creating a new credential.
message CreateClientCredentialRequest {
  // Human-readable name of the credential.
  string name = 1;
  // OAuth2 scopes the client may request.
  repeated string scope = 2;
  // Client authentication method used at the token endpoint.
  string token_endpoint_auth_method = 3;
}

// GetClientCredentialRequest identifies a credential to fetch.
message GetClientCredentialRequest {
  // Gateway identifier for the credential.
  string id = 1;
}

// ListClientCredentialsRequest is the input for paginating credentials.
message ListClientCredentialsRequest {
  // Pagination parameters.
  PageRequest page = 1;
}

// ListClientCredentialsResponse is the output of a paginated credential list.
message ListClientCredentialsResponse {
  // Credentials on the current page.
  repeated ClientCredential client_credentials = 1;
  // Pagination metadata.
  PageResponse page = 2;
}

// UpdateClientCredentialRequest is the input for updating an existing credential.
message UpdateClientCredentialRequest {
  // Gateway identifier for the credential.
  string id = 1;
  // Human-readable name of the credential.
  string name = 2;
  // OAuth2 scopes the client may request.
  repeated string scope = 3;
  // Client authentication method used at the token endpoint.
  string token_endpoint_auth_method = 4;
}

// DeleteClientCredentialRequest identifies a credential to delete.
message DeleteClientCredentialRequest {
  // Gateway identifier for the credential.
  string id = 1;
}

// RotateClientCredentialSecretRequest identifies a credential whose secret should be rotated.
message RotateClientCredentialSecretRequest {
  // Gateway identifier for the credential.
  string id = 1;
}

// ClientCredentialService manages machine-to-machine OAuth2 client credentials for tenants.
service ClientCredentialService {
  // CreateClientCredential registers a new client_credentials OAuth2 client.
  rpc CreateClientCredential(CreateClientCredentialRequest) returns (ClientCredential);
  // GetClientCredential retrieves an existing client_credentials OAuth2 client.
  rpc GetClientCredential(GetClientCredentialRequest) returns (ClientCredential);
  // ListClientCredentials returns a paginated list of client_credentials OAuth2 clients.
  rpc ListClientCredentials(ListClientCredentialsRequest) returns (ListClientCredentialsResponse);
  // UpdateClientCredential modifies an existing client_credentials OAuth2 client.
  rpc UpdateClientCredential(UpdateClientCredentialRequest) returns (ClientCredential);
  // DeleteClientCredential removes a client_credentials OAuth2 client.
  rpc DeleteClientCredential(DeleteClientCredentialRequest) returns (google.protobuf.Empty);
  // RotateClientCredentialSecret generates a new client secret for the credential.
  rpc RotateClientCredentialSecret(RotateClientCredentialSecretRequest) returns (ClientCredentialSecret);
}
