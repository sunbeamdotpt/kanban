[package]
name = "kanban"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Kanban board service"

[lib]
name = "kanban"
path = "src/lib.rs"

[[bin]]
name = "kanban"
path = "src/main.rs"

[[bin]]
name = "keto-coverage"
path = "src/bin/keto-coverage.rs"

[dependencies]
sunbeam-g2v = { path = "../../libs/sunbeam-g2v" }
tokio.workspace = true
axum = { version = "0.8", features = ["http2", "macros"] }
tower.workspace = true
tracing.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
prost.workspace = true
bytes.workspace = true
tonic = "0.14"
tonic-prost = "0.14"
prost-types = "0.14"
redis = { workspace = true }
parking_lot = { workspace = true }
uuid.workspace = true
chrono.workspace = true
# Stage 2c additions
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
async-nats = "0.47"
figment = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace"] }
tracing-opentelemetry = "0.28"
prometheus = "0.13"
metrics = "0.24"
metrics-exporter-prometheus = "0.14"
tower-http = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
# Stage 3d: S3 presigning
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14"
