# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "kanban"
version = "2026.7.11"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sunbeamdotpt/kanban"
publish = false
description = "Kanban board service"

[lib]
name = "kanban"
path = "src/lib.rs"

[[bin]]
name = "kanban"
path = "src/main.rs"

[[bin]]
name = "permission-coverage"
path = "src/bin/permission-coverage.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
async-nats = "0.49"
buffa = "0.7"
buffa-types = { version = "0.7", features = ["json"] }
http = "1"
http-body = "1"
thiserror = "2"
async-stream = "0.3"
axum = { version = "0.8", features = ["http2", "macros"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
metrics = "0.24"
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace"] }
parking_lot = "0.12"
prometheus = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "migrate"] }
sunbeam-g2v = { version = "0.5.2", features = ["client-connectrpc"] }
connectrpc = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "catch-panic", "cors"] }
tracing = "0.1"
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
ulid = { version = "1.2", features = ["serde"] }
url = "2"
sdk = { git = "https://github.com/sunbeamdotpt/sdk", tag = "v3.3.0", default-features = false, features = ["auth"] }

[dev-dependencies]
sdk = { git = "https://github.com/sunbeamdotpt/sdk", tag = "v3.3.0", default-features = false, features = ["testing"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "nats", "minio"] }
futures = "0.3"

[build-dependencies]
connectrpc-build = "0.7"

[workspace]
members = ["."]
resolver = "3"
