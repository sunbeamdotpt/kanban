# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "kanban"
version = "1.0.0-rc6"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sunbeamdotpt/kanban"
publish = false
description = "Kanban board service"

[lib]
name = "kanban"
path = "src/lib.rs"

[[bin]]
name = "kanban"
path = "src/main.rs"

[[bin]]
name = "keto-coverage"
path = "src/bin/keto-coverage.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
async-nats = "0.49"
async-stream = "0.3"
axum = { version = "0.8", features = ["http2", "macros"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
metrics = "0.24"
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace"] }
parking_lot = "0.12"
prometheus = "0.14"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "migrate"] }
sunbeam-g2v = "0.3.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "catch-panic", "cors"] }
tracing = "0.1"
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
ulid = { version = "1.2", features = ["serde"] }
url = "2"

[dev-dependencies]
sunbeam-test = { git = "https://github.com/sunbeamdotpt/test", rev = "8807a47ac5873b380c62e3e5831e77b107b0c952" }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "nats", "minio"] }

[build-dependencies]
tonic-prost-build = "0.14"

[workspace]
members = ["."]
resolver = "3"
